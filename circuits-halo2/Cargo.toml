[package]
name = "channel-state-halo2"
version = "0.1.0"
edition = "2021"

[lib]
name = "channel_state_halo2"
path = "src/lib.rs"

[dependencies]
halo2_proofs = { git = "https://github.com/privacy-scaling-explorations/halo2.git", tag = "v0.3.0" }
halo2curves = "0.6"
rand_core = { version = "0.6", features = ["getrandom"] }
ff = "0.13"
serde_json = "1"

[[bin]]
name = "prove_and_export"
path = "src/bin/prove_and_export.rs"
