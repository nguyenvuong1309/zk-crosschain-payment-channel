name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PTAU_URL: https://storage.googleapis.com/zkevm/ptau/powersOfTau28_hez_final_17.ptau
  PTAU_SHA256: 6b662a324867139fb1a20a324d90b6ff61856dfb23f59326909f14b0e2483ae0
  CIRCOM_VERSION: v2.1.9

jobs:
  # Fast checks: no circuit build needed, catch obvious breakage in seconds.
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: forge fmt --check
        run: forge fmt --check
        working-directory: contracts

      - name: forge build
        run: forge build --sizes
        working-directory: contracts

  # relayer/, watchtower/, bls-validators/, circuits/ are one pnpm workspace
  # (see /pnpm-workspace.yaml) — a single `pnpm install --frozen-lockfile` at
  # the repo root installs all four. TypeScript compiles nothing to disk
  # here (all four packages run their .ts sources directly via tsx, see
  # each package.json), so this is a real "does everything still typecheck"
  # gate, not just a lockfile sanity check.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r run typecheck

  # Full test suite, including the FFI tests that shell out to a real
  # Groth16 prover (ChannelStateProof.t.sol, LightClient.t.sol,
  # KeyOwnership.t.sol) — see contracts/foundry.toml (ffi = true) and
  # docs/threat-model.md. Needs circuits/build/*.zkey + *_js/ populated,
  # which are gitignored (large binaries) and reproduced here, cached by
  # circuit source hash so unchanged circuits skip the trusted-setup
  # ceremony on subsequent runs.
  test-ffi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Cache circom compiler
        id: cache-circom
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/circom
          key: circom-${{ env.CIRCOM_VERSION }}-linux

      - name: Install circom
        if: steps.cache-circom.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL -o ~/.local/bin/circom \
            "https://github.com/iden3/circom/releases/download/${CIRCOM_VERSION}/circom-linux-amd64"
          chmod +x ~/.local/bin/circom
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Installs circuits/ AND bls-validators/ in one shot (pnpm workspace
      # root install) — KeyOwnership.t.sol shells out to
      # circuits/scripts/sign_key_ownership.ts, LightClientVerifierBLS(.Integration).t.sol
      # shell out to ../bls-validators/sign.ts (via each package's own
      # node_modules/.bin/tsx, see those test files' _sign() helpers).
      # Forgetting bls-validators here is exactly what broke this job the
      # first time it ran in CI (MODULE_NOT_FOUND for @noble/curves) — see
      # git history.
      - run: pnpm install --frozen-lockfile

      # Cache the whole trusted-setup output (r1cs, wasm witness
      # calculators, final zkeys) keyed on the circuit sources + the
      # ceremony script, so the phase-2 ceremony (3 contributions per
      # circuit) and the 151MB phase-1 ptau download only run again when
      # something that affects the proving key actually changes.
      - name: Cache circuit build artifacts
        id: cache-circuit-build
        uses: actions/cache@v6
        with:
          path: |
            circuits/build/*.r1cs
            circuits/build/*_js
            circuits/build/*_final*.zkey
            circuits/build/powersOfTau28_hez_final_17.ptau
          key: circuit-build-${{ hashFiles('circuits/circuits/**/*.circom', 'circuits/scripts/run_phase2_ceremony.sh') }}

      - name: Compile circuits
        if: steps.cache-circuit-build.outputs.cache-hit != 'true'
        working-directory: circuits
        run: |
          circom circuits/channel_state.circom --r1cs --wasm --sym -l node_modules -o build
          circom circuits/consensus_proof.circom --r1cs --wasm --sym -l node_modules -o build

      - name: Download + verify phase-1 Powers of Tau
        if: steps.cache-circuit-build.outputs.cache-hit != 'true'
        working-directory: circuits
        run: |
          curl -fsSL -o build/powersOfTau28_hez_final_17.ptau "$PTAU_URL"
          echo "${PTAU_SHA256}  build/powersOfTau28_hez_final_17.ptau" | sha256sum -c -

      - name: Phase-2 ceremony (channel_state)
        if: steps.cache-circuit-build.outputs.cache-hit != 'true'
        working-directory: circuits
        run: bash scripts/run_phase2_ceremony.sh channel_state build/powersOfTau28_hez_final_17.ptau 3

      - name: Phase-2 ceremony (consensus_proof)
        if: steps.cache-circuit-build.outputs.cache-hit != 'true'
        working-directory: circuits
        run: bash scripts/run_phase2_ceremony.sh consensus_proof build/powersOfTau28_hez_final_17.ptau 3

      - name: Rename channel_state zkey to the name prove_and_export.sh expects
        if: steps.cache-circuit-build.outputs.cache-hit != 'true'
        working-directory: circuits
        run: mv build/channel_state_final.zkey build/channel_state_final_v2.zkey

      # run_phase2_ceremony.sh uses fresh OS entropy each run (by design —
      # that's what makes the setup trustworthy, see the script's own
      # comments), so it produces a DIFFERENT verifying key every time the
      # ceremony actually runs. The Groth16Verifier*.sol committed to git
      # were exported from whoever's local one-off ceremony produced the
      # deployed/documented setup (see circuits/README.md) — a freshly
      # generated zkey will NOT match that verifying key, so proofs
      # generated against it fail when checked by the committed verifier
      # contracts (ecpairing returns false / InvalidProof).
      #
      # Always re-export both verifier contracts from whatever zkey is
      # actually in circuits/build/ right now — cheap, and needed on BOTH
      # cache miss (freshly-ceremonied zkey) and cache hit (a zkey from
      # some earlier CI run's ceremony, restored from cache) since neither
      # matches the committed .sol files and only circuits/build/ is
      # cached, not contracts/src/. This intentionally overwrites the
      # committed files for the rest of this job only (nothing is pushed
      # back to the repo).
      - name: Re-export Solidity verifiers from this run's zkeys
        working-directory: circuits
        run: |
          npx snarkjs zkey export solidityverifier build/channel_state_final_v2.zkey /tmp/v.sol
          cp /tmp/v.sol ../contracts/src/Groth16Verifier.sol

          npx snarkjs zkey export solidityverifier build/consensus_proof_final.zkey /tmp/vc.sol
          sed 's/contract Groth16Verifier/contract Groth16VerifierConsensus/' /tmp/vc.sol \
            > ../contracts/src/Groth16VerifierConsensus.sol

      - name: forge test --ffi
        run: forge test --ffi -vvv
        working-directory: contracts

  # Halmos symbolic property tests (Milestone 4) — separate profile from
  # forge test's default (evm_version = shanghai avoided; Halmos needs a
  # recent-enough version for Cancun/MCOPY support, which ubuntu-latest's
  # default `python3` — normally 3.10+ — provides via a plain `pip install`.
  # See contracts/README.md and docs/threat-model.md's "Formal verification"
  # section for why this is a separate toolchain from forge test.
  formal-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install halmos

      - name: forge build --build-info (needed by Halmos for AST)
        run: forge build --build-info --extra-output storageLayout metadata
        working-directory: contracts

      - name: halmos
        run: halmos --contract PaymentChannelFormalTest
        working-directory: contracts

  # circuits-halo2/ (Rust) — MockProver + real KZG prove/verify + bit-for-bit
  # cross-checks against circomlibjs (see circuits-halo2/README.md).
  halo2-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: circuits-halo2

      - name: cargo test
        run: cargo test --release --lib
        working-directory: circuits-halo2

      - name: cargo run --bin prove_and_export (real KZG proof)
        run: cargo run --release --bin prove_and_export
        working-directory: circuits-halo2

  # bls-validators/ — keys.json reproducibility + off-chain pairing
  # self-check (see bls-validators/test.ts). The on-chain half (precompile
  # cross-check, LightClientVerifierBLS integration) runs in test-ffi via
  # forge test — EIP-2537 precompiles are natively supported by Foundry's
  # revm, no extra setup needed there.
  bls-validators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
        working-directory: bls-validators

  # watchtower/ end-to-end demo (Milestone 4) — real Anvil chain, real
  # PaymentChannel deployment, real "partyB goes offline, partyA cheats,
  # watchtower rescues" scenario. See watchtower/README.md.
  watchtower-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: forge build
        run: forge build
        working-directory: contracts

      - name: Start Anvil
        run: anvil --port 8545 --chain-id 31337 &

      - run: pnpm install --frozen-lockfile

      - name: pnpm run e2e
        run: pnpm run e2e
        working-directory: watchtower

  # relayer/ end-to-end cross-chain demo (Milestone 3) — real 2-Anvil setup,
  # real consensus_proof.circom proof relayed Chain A -> Chain B, asserts
  # Chain B's payout matches Chain A's attested state. See README.md's
  # "Demo cross-chain (M3) đầy đủ" section and relayer/src/e2e_demo.ts.
  #
  # `needs: test-ffi` isn't a correctness dependency — it's reused purely to
  # guarantee circuits/build/'s cache entry (ceremony output, see test-ffi's
  # own comments) is already populated by the time this job starts, instead
  # of ceremonying + downloading the 151MB ptau file a second time in
  # parallel for the same commit.
  relayer-e2e:
    needs: test-ffi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same cache as test-ffi (identical key) — see that job for what's in
      # it and why. Expected to always hit here since test-ffi (a dependency
      # of this job) just populated it.
      - name: Restore circuit build artifacts
        uses: actions/cache@v6
        with:
          path: |
            circuits/build/*.r1cs
            circuits/build/*_js
            circuits/build/*_final*.zkey
            circuits/build/powersOfTau28_hez_final_17.ptau
          key: circuit-build-${{ hashFiles('circuits/circuits/**/*.circom', 'circuits/scripts/run_phase2_ceremony.sh') }}

      # Each job runs in its own fresh checkout — contracts/src/ isn't
      # cached, so the committed Groth16Verifier*.sol (bound to whoever's
      # local one-off ceremony) won't match the zkey just restored above.
      # Same fix as test-ffi's identically-named step: re-export both
      # verifiers from THIS job's zkey before building/deploying anything.
      - name: Re-export Solidity verifiers from the cached zkeys
        working-directory: circuits
        run: |
          npx snarkjs zkey export solidityverifier build/channel_state_final_v2.zkey /tmp/v.sol
          cp /tmp/v.sol ../contracts/src/Groth16Verifier.sol

          npx snarkjs zkey export solidityverifier build/consensus_proof_final.zkey /tmp/vc.sol
          sed 's/contract Groth16Verifier/contract Groth16VerifierConsensus/' /tmp/vc.sol \
            > ../contracts/src/Groth16VerifierConsensus.sol

      - name: forge build
        run: forge build
        working-directory: contracts

      - name: Start Chain A + Chain B (Anvil)
        run: |
          anvil --port 8545 --chain-id 31337 --block-time 2 &
          anvil --port 8546 --chain-id 31338 --block-time 3 &

      - name: pnpm run deploy
        run: pnpm run deploy
        working-directory: relayer

      - name: pnpm run e2e
        run: pnpm run e2e
        working-directory: relayer
